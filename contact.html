<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us – Sthrive.app</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070d0a;
      --card-bg: rgba(18, 33, 24, 0.7);
      --card-border: rgba(34, 197, 94, 0.18);
      --primary-green: #22c55e;
      --primary-hover: #16a34a;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-subtle: #6b7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      background-image: radial-gradient(circle at 10% 15%, rgba(34, 197, 94, 0.12) 0%, transparent 45%);
    }
    .container { max-width: 800px; margin: 0 auto; padding: 0 24px; }
    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 0; border-bottom: 1px solid var(--card-border);
    }
    .logo { font-size: 24px; font-weight: 800; color: #fff; text-decoration: none; }
    .logo span { color: var(--primary-green); }
    .contact-box {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 20px; padding: 40px; margin: 40px 0;
    }
    h1 { font-size: 32px; color: #fff; margin-bottom: 8px; }
    p { color: var(--text-muted); font-size: 15px; margin-bottom: 24px; }
    .form-group { margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 13px; font-weight: 600; color: var(--text-muted); }
    input, select, textarea {
      background: rgba(0, 0, 0, 0.4); border: 1px solid var(--card-border);
      padding: 12px 16px; border-radius: 10px; color: #fff; font-family: inherit; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary-green); }
    .btn-submit {
      background: var(--primary-green); color: #05140a; font-weight: 700;
      padding: 14px; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; transition: background 0.2s;
    }
    .btn-submit:hover { background: var(--primary-hover); color: #fff; }
    .direct-contact {
      margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--card-border);
      font-size: 14px; color: var(--text-subtle);
    }
    footer { border-top: 1px solid var(--card-border); padding: 30px 0; text-align: center; color: var(--text-subtle); font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <a href="index.html" class="logo">Sthrive<span>.app</span></a>
      <a href="index.html" style="color: var(--primary-green); text-decoration: none; font-weight: 600;">← Back to Home</a>
    </nav>

    <div class="contact-box">
      <h1>Get in Touch</h1>
      <p>Have questions, issue reports, or business inquiries? Send us a message.</p>

      <form>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" placeholder="john@example.com" required>
        </div>
        <div class="form-group">
          <label>Subject</label>
          <select required>
            <option value="">Select Category</option>
            <option>Account Support</option>
            <option>Reward / Payout Inquiry</option>
            <option>Bug Report</option>
            <option>Business Partnership</option>
          </select>
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea rows="5" placeholder="Describe your inquiry..." required></textarea>
        </div>
        <button type="submit" class="btn-submit">Send Message</button>
      </form>

      <div class="direct-contact">
        Direct Email Support: <strong>sthrive.support@gmail.com</strong><br>
        Response Time: Typically within 24–48 hours.
      </div>
    </div>

    <footer>&copy; 2026 Sthrive.app. All rights reserved.</footer>
  </div>
</body>
</html>
